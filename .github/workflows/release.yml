name: Release

# A tag is what bangyen/esolangs cites, so it gets the compiled papers
# attached for good: CI artifacts expire.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - run: uv sync --locked
      # the tag names the version the metadata carries: `v1` for 1.x.y,
      # `v1.2.0` for exactly 1.2.0
      - name: Check the tag against the metadata
        run: |
          version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag=${GITHUB_REF_NAME#v}
          case "$version." in
            "$tag."*) ;;
            *) echo "tag $GITHUB_REF_NAME does not match version $version" >&2; exit 1 ;;
          esac
      - run: just check
      - name: Install tectonic
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
      - run: just pdf
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" papers/*.pdf \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            || gh release upload "$GITHUB_REF_NAME" papers/*.pdf --clobber
