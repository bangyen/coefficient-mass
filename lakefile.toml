name = "coefficientmass"
version = "0.1.0"
description = "Lean formalization of the coefficient-mass lower bound for polynomial multiples"
keywords = ["math", "polynomials", "formal-verification"]
defaultTargets = ["CoefficientMass"]
lintDriver = "batteries/runLinter"

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 5
maxHeartbeats = 400000

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "CoefficientMass"
