[project]
name = "coefficient-mass"
version = "1.0.0"
description = "Papers and executable checks on the coefficient mass of polynomial multiples"
requires-python = ">=3.12"

[dependency-groups]
dev = ["codespell", "pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.codespell]
# Lean's `numer` and hypothesis names, and the label `lem:optins`.
ignore-words-list = "numer,hda,optins"
skip = "*.lock,./.lake,./scripts"
